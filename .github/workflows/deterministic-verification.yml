name: Deterministic Verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24.15.0"

      - name: Run protocol conformance suite
        run: |
          set -euo pipefail
          node protocol-conformance/runner/run_conformance.mjs

      - name: Run Rust verifier
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          cargo run \
            --manifest-path verifier/rust/Cargo.toml \
            --bin verifrax-rust-verifier
