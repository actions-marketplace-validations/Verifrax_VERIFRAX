name: spec-bundle
on:
  pull_request:
  push:
    branches: [ main ]
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"
      - name: Rebuild spec bundle
        run: |
          python3 scripts/spec-bundle.py
      - name: Fail if bundle drift
        run: |
          git diff --exit-code -- edge-spec-worker/spec.bundle.js
